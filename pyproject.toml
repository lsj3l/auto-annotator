[project]
name = "auto-annotator"
version = "1.0.0"
description = "PDF reading annotations with AI highlights and neural handwritten margin notes"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "PyMuPDF==1.26.5",
  "Pillow==11.3.0",
  "pydantic==2.13.5",
  "google-genai==1.47.0",
  "nodejs-wheel-binaries==24.19.0",
]

[tool.vercel]
entrypoint = "app:app"
